<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Hangout Planner</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="card auth-card">
      <h1 style="text-align:center">Hangout <span style="color:var(--accent)">Planner</span></h1>
      <p class="muted small" style="text-align:center;margin-top:4px">Plan hangouts with your friends, without the group-chat chaos.</p>

      <div class="tabs" style="margin-top:20px">
        <button class="tab active" data-tab="login">Sign in</button>
        <button class="tab" data-tab="register">Create account</button>
      </div>

      <!-- Sign in (mockup: any input goes straight to the dashboard) -->
      <form class="tab-panel" id="login" action="groups.html">
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" placeholder="••••••••" required>
        </div>
        <button class="btn btn-primary btn-block" style="margin-top:16px">Sign in</button>
      </form>

      <!-- Register -->
      <form class="tab-panel" id="register" action="groups.html" hidden>
        <div class="field">
          <label for="reg-name">Name</label>
          <input id="reg-name" type="text" placeholder="Your name" required>
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input id="reg-email" type="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="reg-password">Password</label>
          <input id="reg-password" type="password" placeholder="At least 8 characters" minlength="8" required>
        </div>
        <button class="btn btn-primary btn-block" style="margin-top:16px">Create account</button>
      </form>

      <div class="divider">or</div>
      <a class="btn btn-block" href="groups.html">Continue with Google</a>
    </div>
  </main>

  <script>
    document.querySelectorAll('.tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t === tab));
        document.querySelectorAll('.tab-panel').forEach((p) => (p.hidden = p.id !== tab.dataset.tab));
      });
    });
  </script>
</body>
</html>
